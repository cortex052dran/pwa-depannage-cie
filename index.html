<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PWA Dépannage CIE</title>
</head>
<body>
    <h1>PWA Dépannage CIE</h1>
    <p id="message" style="font-weight: bold; color: blue;">En attente du clic...</p>
    <button onclick="chargerAgents()">Tester la connexion</button>

    <script>
        async function chargerAgents() {
            const message = document.getElementById("message");
            message.style.color = "blue";
            message.innerText = "Connexion via le pont Cloudflare...";

            // 👇 REMPLACE ICI PAR L'URL DE TON WORKER CLOUDFLARE (ex: https://pont-supabase.xxx.workers.dev)
            const urlPontCloudflare = "pont-supabase.cortex052dran.workers.dev/";
            
            // On ajoute le chemin vers la table agents
            const urlFinale = urlPontCloudflare + "/rest/v1/agents?select=*";

            try {
                const reponse = await fetch(urlFinale, {
                    method: 'GET',
                    headers: {
                        'apikey': "sb_publishable_FSV5BF_QkdnMDvunTVYP9Q_53d42z6t",
                        'Authorization': "Bearer sb_publishable_FSV5BF_QkdnMDvunTVYP9Q_53d42z6t"
                    }
                });

                const donnees = await reponse.json();
                
                if (reponse.ok) {
                    message.style.color = "green";
                    message.innerText = "Victoire ! Le pont fonctionne. Table vide.";
                } else {
                    message.style.color = "red";
                    message.innerText = "Le pont a répondu (Code " + reponse.status + ") : " + JSON.stringify(donnees);
                }
                
            } catch (erreur) {
                message.style.color = "red";
                message.innerText = "Échec de communication. Erreur : " + erreur.message;
            }
        }
    </script>
</body>
</html>
