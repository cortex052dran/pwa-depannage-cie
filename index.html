<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PWA Dépannage CIE</title>
</head>
<body>
    <h1>PWA Dépannage CIE</h1>
    <p id="message" style="font-weight: bold; color: blue;">En attente du clic...</p>
    <button onclick="chargerAgents()">Tester la connexion</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // L'adresse est maintenant PARFAITE (avec .supabase.co)
        const SUPABASE_URL = "https://sqcjycoddjbtvcgtdcaz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_FSV5BF_QkdnMDvunTVYP9Q_53d42z6t"; 

        let supabaseClient = null;

        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (erreur) {
            document.getElementById("message").style.color = "red";
            document.getElementById("message").innerText = "Erreur d'initialisation : " + erreur.message;
        }

        async function chargerAgents() {
            const message = document.getElementById("message");
            message.style.color = "blue";
            message.innerText = "Chargement...";

            if (!supabaseClient) {
                message.style.color = "red";
                message.innerText = "Erreur : Les clés Supabase sont mal configurées.";
                return;
            }

            try {
                const { data, error } = await supabaseClient.from('agents').select('*');

                if (error) {
                    message.style.color = "red";
                    message.innerText = "Erreur (Vigile RLS) : " + error.message;
                } else {
                    message.style.color = "green";
                    if (data.length === 0) {
                        message.innerText = "Succès ! La connexion fonctionne, la table est vide.";
                    } else {
                        message.innerText = "Succès ! Il y a " + data.length + " agent(s).";
                    }
                }
            } catch (e) {
                message.style.color = "red";
                message.innerText = "Erreur inattendue : " + e.message;
            }
        }
    </script>
</body>
</html>
