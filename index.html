<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PWA Dépannage CIE</title>
</head>
<body>
    <h1>PWA Dépannage CIE</h1>
    <p id="message" style="font-weight: bold; color: blue;">En attente du clic...</p>
    <button onclick="testerConnexionDirecte()">Tester la connexion</button>

    <script>
        async function testerConnexionDirecte() {
            const message = document.getElementById("message");
            message.style.color = "blue";
            message.innerText = "Test de communication en cours...";

            const url = "https://sqcjycoddjbtvcgtdcaz.supabase.co/rest/v1/agents?select=*";
            const key = "sb_publishable_FSV5BF_QkdnMDvunTVYP9Q_53d42z6t";

            try {
                // On utilise fetch directement
                const reponse = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'apikey': key,
                        'Authorization': 'Bearer ' + key
                    }
                });

                // Si le serveur répond, on lit le message
                const donnees = await reponse.json();
                
                if (reponse.ok) {
                    message.style.color = "green";
                    message.innerText = "Victoire ! Connexion réussie. L'API répond.";
                } else {
                    message.style.color = "red";
                    message.innerText = "Le serveur a répondu, mais avec une erreur (C'est normal, c'est le vigile) : " + JSON.stringify(donnees);
                }
                
            } catch (erreur) {
                message.style.color = "red";
                message.innerText = "Échec de communication. Ton navigateur bloque l'accès à Supabase. Erreur : " + erreur.message;
            }
        }
    </script>
</body>
</html>
